name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
      - master
      - release/**

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Deploy the frontend folder to Vercel in production mode
          vercel ./frontend --prod --token $VERCEL_TOKEN --confirm

# Secrets required:
# - VERCEL_TOKEN: token with permission to deploy
# - REACT_APP_BACKEND_URL: public backend URL used at build time
