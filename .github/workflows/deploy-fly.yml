name: Deploy to Fly

on:
  push:
    branches:
      - main
      - master
      - release/**

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions@v1
        with:
          version: latest

      - name: Authenticate Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          fly auth token $FLY_API_TOKEN

      - name: Deploy to Fly
        working-directory: backend
        run: |
          fly deploy --config fly.toml --remote-only

# Notes:
# - Ensure `backend/fly.toml` is configured (app name, region). Use `fly secrets set` locally or
#   Secrets in GitHub for sensitive envs.
