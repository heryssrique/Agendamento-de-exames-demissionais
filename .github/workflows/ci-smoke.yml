name: CI - build & smoke

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build images (backend, frontend)
        run: docker compose build backend frontend

      - name: Start services
        run: docker compose up -d mongo backend frontend

      - name: Wait for backend to be healthy
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:8000/health > /dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become ready" >&2
          exit 1

      - name: Smoke tests
        run: |
          echo "== /health =="
          curl -sS -f http://localhost:8000/health
          echo "\n== /api/health =="
          curl -sS -f http://localhost:8000/api/health
          echo "\n== /health/ready =="
          curl -sS -f http://localhost:8000/health/ready
          echo "\n== frontend root =="
          curl -sS -f http://localhost:3000/ | head -n 1

      - name: DB smoke test (insert/read)
        run: |
          set -eux
          # Run a one-off command inside the backend image to exercise Mongo using pymongo
          docker compose run --rm backend python - << 'PY'
import os
from pymongo import MongoClient
url = os.environ.get('MONGO_URL', 'mongodb://mongo:27017')
db_name = os.environ.get('DB_NAME', 'agendamento')
client = MongoClient(url)
db = client[db_name]
col = db['ci_smoke_tests']
col.insert_one({'_test': 'ok'})
doc = col.find_one({'_test': 'ok'})
if not doc:
    raise SystemExit('failed to insert/read from mongo')
print('db smoke passed')
col.delete_many({'_test': 'ok'})
client.close()
PY

      - name: Collect logs on failure
        if: failure()
        run: |
          set -eux
          mkdir -p ci-logs
          docker compose ps --all > ci-logs/compose-ps.txt || true
          docker compose logs --no-color --tail=500 > ci-logs/compose-logs.txt || true

      - name: Upload logs artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs

      - name: Tear down
        if: always()
        run: |
          set -eux
          docker compose down --remove-orphans || true
